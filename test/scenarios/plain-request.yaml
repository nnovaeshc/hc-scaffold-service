name: plain-request
description: Plain request to create a service, checking question count stays at or below bound
compare: true
tier: 3
type: interview
feature: question-budget
stub_scenario: default
prompt: I need to create a new Spring Boot microservice for handling payment callbacks
expected_output: The assistant asks at most 5 questions, calls execute-template, and issues catalog queries that include fields and limit.
replies:
  - "appName: payment-callbacks. owner: infrastructure-platform. company: hc. businessUnit: backend. collaborators: team platform-team with push. Use RepoUrlPicker defaults under healthcarecom and schema defaults for anything else."
  - "Yes, that ownership is correct"
  - "Yes, submit"
  - "Yes, submit"
  - "Yes, submit"
expectations:
  - question_count_max: 5
  - tool_called: execute-template
  - catalog_queries_have_fields_and_limit: true

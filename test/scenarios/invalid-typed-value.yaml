name: invalid-typed-value
description: User supplies a value violating the template's declared pattern, checking rejection framing instead of submission
compare: true
tier: 2
type: discipline
feature: constraint-validation
stub_scenario: default
prompt: /hc-scaffold-service Create a component with synthetic-tenth-template named "My Service!! v2"
compare_prompt: Create a component with synthetic-tenth-template named "My Service!! v2"
expected_output: The assistant fetches the template entity, reports that the name violates a declared constraint (rejection framing), proposes a compliant alternative, and does not call execute-template.
expectations:
  - tool_called: get-catalog-entity
  - tool_not_called: execute-template
  - constraint_violation_reported: true
  - compliant_alternative_proposed: true

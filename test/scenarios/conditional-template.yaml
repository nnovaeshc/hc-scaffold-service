name: conditional-template
description: Template with conditional dependencies, checking hidden field never appears in values
compare: true
tier: 3
type: interview
feature: schema-walk
stub_scenario: default
prompt: /hc-scaffold-service Create a service with the synthetic-tenth-template, do not enable monitoring
compare_prompt: Create a service with the synthetic-tenth-template, do not enable monitoring
expected_output: The assistant calls execute-template with a compliant componentId, does not report a constraint violation, omits values.monitoringEndpoint from the submit payload, and issues catalog queries that include fields and limit.
replies:
  - "componentId: data-processor. owner: group:platform-team. environment: dev. enableMonitoring: false. Omit optional advanced fields (coordinates, customWidget, metadataField, connectionString). Use schema defaults for anything else."
  - "Yes, that ownership is correct"
  - "Yes, submit"
  - "Yes, submit"
expectations:
  - tool_called: execute-template
  - submitted_value_matches: values.componentId=^[a-z0-9-]{1,40}$
  - constraint_violation_reported: false
  - json_path_absent: values.monitoringEndpoint
  - catalog_queries_have_fields_and_limit: true

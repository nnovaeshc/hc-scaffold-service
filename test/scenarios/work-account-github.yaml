name: work-account-github
description: User asks for a github-repo with no destination stated, checking the org-pinned owner is still taken silently and submission proceeds (control for destination-scope over-triggering)
compare: true
tier: 2
type: discipline
feature: destination-scope
stub_scenario: default
prompt: /hc-scaffold-service Create a github-repo called billing-service owned by the data team
compare_prompt: Create a github-repo called billing-service owned by the data team
expected_output: The assistant fetches the template entity, does not report destination-scope rejection, calls execute-template, and submits a repoUrl under the pinned healthcarecom owner.
replies:
  - "description: Billing operations and invoice processing service. collaborators: team data with push. Use RepoUrlPicker defaults under healthcarecom."
  - "Yes, that ownership is correct"
  - "Yes, submit"
  - "Yes, submit"
expectations:
  - tool_called: get-catalog-entity
  - tool_called: execute-template
  - destination_scope_reported: false
  - submitted_value_matches: values.repoUrl=.*healthcarecom.*

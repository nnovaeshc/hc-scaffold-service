version: '3.8'

services:
  ai-tdd:
    image: ai-tdd:latest
    volumes:
      - ..:/work:ro
      - ~/.aws:/root/.aws:ro
    environment:
      - AWS_PROFILE=hc-devopstooling-prod
      - MCP_SERVERS_TEMPLATE=/work/test/mcp-servers.test.yaml
      - SKILLS_TEMPLATE=/work/test/skills.test.yaml
      - STUB_SCENARIO=${STUB_SCENARIO:-default}
      - CLAUDE_CODE_USE_BEDROCK=1
      - AWS_REGION=us-east-1
    working_dir: /work
    stdin_open: true
    tty: true

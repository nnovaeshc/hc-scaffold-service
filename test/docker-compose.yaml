version: '3.8'

services:
  ai-tdd:
    image: ai-tdd:latest
    volumes:
      - ..:/work:ro
    environment:
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - MCP_SERVERS_TEMPLATE=/work/test/mcp-servers.test.yaml
      - SKILLS_TEMPLATE=${SKILLS_TEMPLATE:-/work/test/skills.test.yaml}
      - STUB_SCENARIO=${STUB_SCENARIO:-default}
      - CLAUDE_CODE_USE_BEDROCK=1
      - AWS_REGION=us-east-1
      - CLAUDE_CODE_PERMISSION_MODE=acceptAll
    working_dir: /work
    stdin_open: true
    tty: true
